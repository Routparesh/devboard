name: cd

on: workflow_call

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: env copy
        run: |
          cp .env.example .env

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: docker compose
        run: |
          docker compose up -d
