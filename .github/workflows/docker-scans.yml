name: docker-scan

on:
  workflow_call:

permissions:
  contents: write

jobs:
  dockerfile-lint-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folder: ['frontend', 'backend']
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.folder }}/Dockerfile

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: docker build ${{ matrix.folder }}
        working-directory: ${{ matrix.folder }}
        run: docker build -t ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folder }}:latest .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folder }}:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: docker push
        run: |
          docker push  ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folder }}:latest

      - name: Update image in docker-compose file
        run: |
          # Update only the backend service
          sed -i '/^  backend:/,/^  frontend:/ s|image: .*|image: ${{ vars.DOCKERHUB_USERNAME }}/devboard-backend:latest|' docker-compose.yml

          # Update only the frontend service
          sed -i '/^  frontend:/,/^volumes:/ s|image: .*|image: ${{ vars.DOCKERHUB_USERNAME }}/devboard-frontend:latest|' docker-compose.yml

          echo "Updated docker-compose.yml:"
          cat docker-compose.yml

      - name: Commit and push changes
        run: |
          git config user.name "routparesh"
          git config user.email "routpareshkumar737@gmail.com"

          git add docker-compose.yml

          if ! git diff --cached --quiet; then
          git commit -m "chore: update Docker image names"
          git push origin HEAD:${GITHUB_REF_NAME}
             else
          echo "No changes to commit"
          fi
