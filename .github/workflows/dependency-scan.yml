name: dependency-scan

on:
  workflow_call:

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'

      - name: Update golang.org/x/net
        working-directory: ./backend # replace with your actual Go folder path
        run: |
          go get golang.org/x/net@v0.63.0
          go mod tidy

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        continue-on-error: true
        with:
          go-version-input: '1.26.11' # Matches your go.mod version
          go-package: './...'
          work-dir: './backend'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # ESLint and Prettier must be in `package.json`
      - name: Install Node.js dependencies
        working-directory: ./frontend
        run: |
          npm install

      - name: Run security audit
        run: npm audit --audit-level=high

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scan-report
          path: reports/dependency-check.txt
